[package]
name = "paratwin-devserver"
version = "1.0.0"
edition = "2021"

[dependencies]
paratwin-engine = { path = "../engine" }
paratwin-host = { path = "../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
