[package]
name = "paratwin-host"
version = "1.0.0"
edition = "2021"

[dependencies]
paratwin-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
anyhow = "1"
