[package]
name = "paratwin-app"
version = "1.3.1"
description = "ParaTwin — ParaExpress Digital Twin Simulator (ParagonCorp)"
edition = "2021"

[lib]
name = "paratwin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
paratwin-engine = { path = "../engine" }
paratwin-host = { path = "../host" }
anyhow = "1"
